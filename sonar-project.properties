# Local SonarQube analysis (http://localhost:9000). Token: SONAR_TOKEN from the environment.
sonar.projectKey=popcorntv
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=apps/server/coverage/lcov.info,apps/web/coverage/lcov.info,packages/shared/coverage/lcov.info
